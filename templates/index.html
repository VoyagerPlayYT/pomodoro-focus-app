<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study & Pomodoro Focus — Трекер фокуса и продуктивности</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zen: {
                            bg: '#0F1117',
                            card: '#161922',
                            border: '#242938',
                            focus: '#818CF8',
                            break: '#34D399',
                            long: '#38BDF8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .circle-progress {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-[#0F1117] text-slate-100 min-h-screen flex flex-col font-sans select-none">
    <!-- Header -->
    <header class="border-b border-[#242938] bg-[#161922]/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center text-white text-xl shadow-lg shadow-indigo-500/20">
                    🍅
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Smart Study & Focus Pro</h1>
                    <p class="text-xs text-slate-400">Таймер глубокой концентрации, звуковой фон и аналитика</p>
                </div>
            </div>
            <!-- Ambient sound toggle -->
            <div class="flex items-center space-x-2">
                <button onclick="toggleAmbientNoise()" id="ambientBtn" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center space-x-2 border border-slate-700 transition">
                    <span id="ambientIcon">🌧️</span>
                    <span id="ambientText">Звук дождя (Выкл)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Left: Pomodoro Timer Core (7 cols) -->
        <div class="lg:col-span-7 bg-[#161922] border border-[#242938] rounded-3xl p-6 sm:p-8 flex flex-col items-center justify-between shadow-2xl relative overflow-hidden">
            <!-- Mode Switcher -->
            <div class="flex p-1.5 rounded-2xl bg-[#0F1117] border border-[#242938] space-x-1">
                <button onclick="setMode('focus', 25)" id="btnModeFocus" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow">
                    🧠 Учёба (25м)
                </button>
                <button onclick="setMode('shortBreak', 5)" id="btnModeShort" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
                    ☕ Отдых (5м)
                </button>
                <button onclick="setMode('longBreak', 15)" id="btnModeLong" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
                    🌴 Перерыв (15м)
                </button>
                <button onclick="setMode('quick', 1)" id="btnModeQuick" class="px-3 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white">
                    ⚡ 1м тест
                </button>
            </div>

            <!-- Circular Timer -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 my-6 flex items-center justify-center">
                <svg class="w-full h-full" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="88" stroke="#1F2432" stroke-width="8" fill="transparent" />
                    <circle id="progressCircle" cx="100" cy="100" r="88" stroke="#6366F1" stroke-width="8"
                        stroke-linecap="round" fill="transparent" stroke-dasharray="552.92" stroke-dashoffset="0" class="circle-progress" />
                </svg>
                <div class="absolute flex flex-col items-center">
                    <span id="timerDisplay" class="text-5xl sm:text-6xl font-black font-mono tracking-tight text-white">25:00</span>
                    <span id="timerSubtext" class="text-xs font-semibold text-indigo-400 uppercase tracking-widest mt-1">Режим концентрации</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center space-x-4">
                <button onclick="toggleTimer()" id="mainPlayBtn" class="px-8 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-base shadow-xl shadow-indigo-600/30 transition transform active:scale-95">
                    Старт фокуса
                </button>
                <button onclick="resetTimer()" class="p-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm transition">
                    🔄 Сброс
                </button>
            </div>
        </div>

        <!-- Right: Tasks & Weekly Stats (5 cols) -->
        <div class="lg:col-span-5 space-y-6">
            <!-- Weekly Progress Chart -->
            <div class="bg-[#161922] border border-[#242938] rounded-3xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm text-slate-200">📊 Прогресс за неделю (минуты фокуса)</h3>
                    <span class="text-xs font-mono text-emerald-400 font-bold" id="streakBadge">🔥 7 дней подряд</span>
                </div>
                <div class="h-40">
                    <canvas id="weeklyChart"></canvas>
                </div>
                <div class="grid grid-cols-2 gap-3 mt-4 pt-3 border-t border-[#242938] text-center">
                    <div>
                        <div class="text-xl font-black font-mono text-indigo-400" id="totalHoursVal">0 ч</div>
                        <div class="text-[10px] text-slate-400 uppercase font-bold">Часов учёбы</div>
                    </div>
                    <div>
                        <div class="text-xl font-black font-mono text-rose-400" id="totalSessionsVal">0</div>
                        <div class="text-[10px] text-slate-400 uppercase font-bold">Сессий закрыто</div>
                    </div>
                </div>
            </div>

            <!-- Daily Study Tasks Checklist -->
            <div class="bg-[#161922] border border-[#242938] rounded-3xl p-6 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-slate-200">🎯 Задачи на сегодня</h3>
                    <span class="text-xs text-slate-400">Помодоро-план</span>
                </div>

                <form onsubmit="handleAddTask(event)" class="flex gap-2">
                    <input type="text" id="taskInput" placeholder="Добавить цель занятия..." required
                        class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition">
                        +
                    </button>
                </form>

                <div id="tasksList" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- Tasks stream -->
                </div>
            </div>
        </div>
    </main>

    <script>
        // Web Audio Synthesizer (Zero External Audio Files)
        let audioCtx = null;
        let ambientNode = null;
        let isAmbientPlaying = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Play relaxing Tibetan bowl chime
        function playChime() {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(528, ctx.currentTime); // 528 Hz Solfeggio frequency
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 1.5);

            gain.gain.setValueAtTime(0.4, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 3.0);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 3.0);
        }

        // Procedural Rain / White Noise Generator
        function toggleAmbientNoise() {
            const ctx = getAudioContext();
            const btn = document.getElementById('ambientBtn');
            const txt = document.getElementById('ambientText');

            if (!isAmbientPlaying) {
                // Generate pink/brownian noise for rain sound
                const bufferSize = ctx.sampleRate * 2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0.0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 2.5; // Gain adjustment
                }

                ambientNode = ctx.createBufferSource();
                ambientNode.buffer = buffer;
                ambientNode.loop = true;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, ctx.currentTime);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.12, ctx.currentTime);

                ambientNode.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                ambientNode.start();
                isAmbientPlaying = true;
                btn.className = 'px-3 py-1.5 rounded-xl bg-emerald-600/30 border border-emerald-500/50 text-emerald-300 text-xs flex items-center space-x-2 transition';
                txt.innerText = 'Звук дождя (Вкл 🔊)';
            } else {
                if (ambientNode) ambientNode.stop();
                isAmbientPlaying = false;
                btn.className = 'px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center space-x-2 border border-slate-700 transition';
                txt.innerText = 'Звук дождя (Выкл)';
            }
        }

        // Timer Logic
        let currentMode = 'focus';
        let totalSeconds = 25 * 60;
        let remainingSeconds = totalSeconds;
        let timerInterval = null;
        let isRunning = false;
        const circleCircumference = 552.92;

        function setMode(mode, minutes) {
            currentMode = mode;
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            clearInterval(timerInterval);
            isRunning = false;
            document.getElementById('mainPlayBtn').innerText = 'Старт фокуса';

            // Button highlights
            ['btnModeFocus', 'btnModeShort', 'btnModeLong', 'btnModeQuick'].forEach(id => {
                document.getElementById(id).className = 'px-4 py-2 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white';
            });

            const sub = document.getElementById('timerSubtext');
            const circle = document.getElementById('progressCircle');

            if (mode === 'focus') {
                document.getElementById('btnModeFocus').className = 'px-4 py-2 rounded-xl text-xs font-bold transition bg-indigo-600 text-white shadow';
                sub.innerText = 'Режим концентрации';
                circle.setAttribute('stroke', '#6366F1');
            } else if (mode === 'shortBreak') {
                document.getElementById('btnModeShort').className = 'px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow';
                sub.innerText = 'Короткий отдых ☕';
                circle.setAttribute('stroke', '#10B981');
            } else if (mode === 'longBreak') {
                document.getElementById('btnModeLong').className = 'px-4 py-2 rounded-xl text-xs font-bold transition bg-sky-600 text-white shadow';
                sub.innerText = 'Большая перезагрузка 🌴';
                circle.setAttribute('stroke', '#38BDF8');
            } else {
                document.getElementById('btnModeQuick').className = 'px-3 py-2 rounded-xl text-xs font-bold transition bg-amber-600 text-white shadow';
                sub.innerText = 'Тест таймера ⚡';
                circle.setAttribute('stroke', '#F59E0B');
            }

            updateDisplay();
        }

        function toggleTimer() {
            getAudioContext();
            const btn = document.getElementById('mainPlayBtn');
            if (isRunning) {
                clearInterval(timerInterval);
                isRunning = false;
                btn.innerText = 'Продолжить';
            } else {
                isRunning = true;
                btn.innerText = 'Пауза';
                timerInterval = setInterval(() => {
                    remainingSeconds--;
                    updateDisplay();
                    if (remainingSeconds <= 0) {
                        clearInterval(timerInterval);
                        isRunning = false;
                        btn.innerText = 'Старт фокуса';
                        playChime();
                        recordCompletedSession();
                        alert('🎉 Время сессии истекло! Отличная концентрация.');
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = totalSeconds;
            document.getElementById('mainPlayBtn').innerText = 'Старт фокуса';
            updateDisplay();
        }

        function updateDisplay() {
            const m = Math.floor(remainingSeconds / 60);
            const s = remainingSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;

            // Circular progress
            const fraction = remainingSeconds / totalSeconds;
            const offset = circleCircumference * (1 - fraction);
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
        }

        async function recordCompletedSession() {
            const mins = Math.max(1, Math.round(totalSeconds / 60));
            await fetch('/api/sessions/complete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ mode: currentMode, duration_minutes: mins })
            });
            fetchStats();
        }

        // Chart & Tasks
        let weeklyChartInstance = null;

        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                document.getElementById('totalHoursVal').innerText = `${data.total_hours} ч`;
                document.getElementById('totalSessionsVal').innerText = data.total_sessions;
                document.getElementById('streakBadge').innerText = `🔥 ${data.streak_days} дней подряд`;

                renderChart(data.weekly_chart);
            } catch (e) {}
        }

        function renderChart(weeklyData) {
            const ctx = document.getElementById('weeklyChart').getContext('2d');
            const labels = weeklyData.map(d => d.day);
            const values = weeklyData.map(d => d.minutes);

            if (weeklyChartInstance) {
                weeklyChartInstance.data.labels = labels;
                weeklyChartInstance.data.datasets[0].data = values;
                weeklyChartInstance.update();
                return;
            }

            weeklyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Минут фокуса',
                        data: values,
                        backgroundColor: '#6366F1',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#242938' }, ticks: { color: '#64748B' } },
                        x: { grid: { display: false }, ticks: { color: '#94A3B8' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        async function fetchTasks() {
            try {
                const res = await fetch('/api/tasks');
                const data = await res.json();
                const container = document.getElementById('tasksList');

                container.innerHTML = data.tasks.map(t => `
                    <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-between text-xs">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" ${t.is_completed ? 'checked' : ''} onchange="toggleTask(${t.id})"
                                class="w-4 h-4 text-indigo-600 rounded border-slate-700 focus:ring-indigo-500 cursor-pointer">
                            <span class="${t.is_completed ? 'line-through text-slate-500' : 'text-slate-200'}">${escapeHtml(t.title)}</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] text-rose-400 font-mono">🍅 ${t.completed_pomodoros}/${t.estimated_pomodoros}</span>
                            <button onclick="deleteTask(${t.id})" class="text-slate-500 hover:text-rose-400">✕</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {}
        }

        async function handleAddTask(e) {
            e.preventDefault();
            const input = document.getElementById('taskInput');
            const title = input.value.trim();
            if (!title) return;

            await fetch('/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, estimated_pomodoros: 2 })
            });

            input.value = '';
            fetchTasks();
        }

        async function toggleTask(id) {
            await fetch(`/api/tasks/${id}/toggle`, { method: 'PATCH' });
            fetchTasks();
        }

        async function deleteTask(id) {
            await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
            fetchTasks();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        updateDisplay();
        fetchStats();
        fetchTasks();
    </script>
</body>
</html>
